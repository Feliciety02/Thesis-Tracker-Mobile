<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Banana Thesis Tracker</title>
  <desc id="desc">Banana Thesis Tracker logo and name on a soft green gradient, with a phone showing the Samples screen and a leaf moving from photos to bagged to sent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8ed"/>
      <stop offset="1" stop-color="#e6eed5"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7ee"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1f4b3a" flood-opacity=".14"/>
    </filter>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1199" height="339" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle cx="1120" cy="-32" r="228" fill="#d9e9bd" opacity=".75"/>
    <circle cx="770" cy="352" r="166" fill="#edf3de"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#dfe7cd"/>

  <g transform="translate(96 106)">
    <g transform="scale(1.0667)"><rect width="120" height="120" rx="27" fill="#1f4b3a"/><g transform="translate(12 10) scale(0.8)"><path d="M16 104 C 6 80, 26 50, 54 32 C 72 20, 92 10, 104 11 C 113 12, 113 22, 108 32 C 98 52, 82 70, 64 84 C 46 98, 28 110, 16 104 Z" fill="#7cb53a"/><path d="M52 98 L62 82 L59 99 Z" fill="#1f4b3a"/><path d="M80 76 L89 62 L87 75 Z" fill="#1f4b3a"/><path d="M20 100 L104 16" stroke="#f7f6ef" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.9"/><g transform="rotate(-14 34 96)"><rect x="4" y="85" width="62" height="22" rx="3" fill="#f2e6b8" stroke="#c9b97c" stroke-width="1.6"/><path d="M18 96 H40 M46 96 H54" stroke="#2b2200" stroke-width="4" stroke-linecap="round"/></g></g></g>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="267" y="134" font-size="14" font-weight="700" letter-spacing="2.5" fill="#537d21">BANANA · FIELDWORK</text>
    <text x="264" y="190" font-size="60" font-weight="800" letter-spacing="-1.8" fill="#1f3b33">Thesis <tspan fill="#588d10">Tracker</tspan></text>
    <text x="267" y="230" font-size="20" fill="#52675a">From the farm to the team's Google Sheet.</text>
  </g>

  <rect x="780" y="70" width="1" height="200" fill="#d3dfbf"/>
  <g clip-path="url(#frame)">
    <g filter="url(#shadow)" transform="translate(850 19)">
    <rect width="274" height="346" rx="31" fill="#183d30"/>
    <rect x="9" y="10" width="256" height="329" rx="25" fill="url(#phone)"/>
    <rect x="104" y="17" width="66" height="9" rx="4.5" fill="#183d30"/>
    <g transform="translate(27 45) scale(0.233)"><rect width="120" height="120" rx="27" fill="#1f4b3a"/><g transform="translate(12 10) scale(0.8)"><path d="M16 104 C 6 80, 26 50, 54 32 C 72 20, 92 10, 104 11 C 113 12, 113 22, 108 32 C 98 52, 82 70, 64 84 C 46 98, 28 110, 16 104 Z" fill="#7cb53a"/><path d="M52 98 L62 82 L59 99 Z" fill="#1f4b3a"/><path d="M80 76 L89 62 L87 75 Z" fill="#1f4b3a"/><path d="M20 100 L104 16" stroke="#f7f6ef" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.9"/><g transform="rotate(-14 34 96)"><rect x="4" y="85" width="62" height="22" rx="3" fill="#f2e6b8" stroke="#c9b97c" stroke-width="1.6"/><path d="M18 96 H40 M46 96 H54" stroke="#2b2200" stroke-width="4" stroke-linecap="round"/></g></g></g>
    <text x="63" y="66" fill="#1f3b33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Samples</text>
    <rect x="24" y="86" width="226" height="71" rx="15" fill="#e8f1da"/>
    <text x="44" y="119" fill="#1f4b3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">34</text>
    <text x="44" y="140" fill="#657568" font-family="Arial, Helvetica, sans-serif" font-size="12">team leaves</text>
    <text x="167" y="119" fill="#1f4b3a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">32</text>
    <text x="166" y="140" fill="#657568" font-family="Arial, Helvetica, sans-serif" font-size="12">to send</text>
    <rect x="24" y="178" width="226" height="131" rx="15" fill="#ffffff" stroke="#d7e1cb"/>
    <rect x="35" y="190" width="72" height="30" rx="7" fill="#edf4e2"/>
    <text x="46" y="211" fill="#24513c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">FA-001</text>
    <text x="36" y="240" fill="#4b6753" font-family="Arial, Helvetica, sans-serif" font-size="13">Photos → Bagged → Sent</text>
    <line x1="49" y1="271" x2="225" y2="271" stroke="#cbd8c0" stroke-width="5"/>
    <line x1="49" y1="271" x2="159" y2="271" stroke="#588d10" stroke-width="5"/>
    <circle cx="49" cy="271" r="12" fill="#588d10"/>
    <circle cx="104" cy="271" r="12" fill="#588d10"/>
    <circle cx="159" cy="271" r="12" fill="#ffffff" stroke="#1f4b3a" stroke-width="4"/>
    <circle cx="225" cy="271" r="12" fill="#ffffff" stroke="#cbd8c0" stroke-width="4"/>
    </g>
  </g>
</svg>
